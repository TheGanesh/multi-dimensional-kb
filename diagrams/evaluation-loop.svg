<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'SF Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <marker id="el1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#475569"/></marker>
    <marker id="el2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#00f0ff"/></marker>
    <filter id="elglow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="elgrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.5" fill="#1e293b"/></pattern>
  </defs>

  <rect width="960" height="720" fill="#080c14" rx="16"/>
  <rect width="960" height="720" fill="url(#elgrid)" rx="16"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#00f0ff" font-size="18" font-weight="700" filter="url(#elglow)">Evaluation Stack &#x2014; Five Layers of Proof</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="10">each layer answers a different question &#x00b7; each is gated or dashboarded &#x00b7; zoomcamp modules 04/05 absorbed</text>

  <!-- ============ LEFT: KB ASSETS ============ -->
  <rect x="30" y="90" width="200" height="84" rx="10" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="130" y="112" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">markdown/ bundle</text>
  <text x="130" y="128" text-anchor="middle" fill="#64748b" font-size="8">1,291 chunks &#x00b7; stable kb:// URIs</text>
  <text x="130" y="142" text-anchor="middle" fill="#64748b" font-size="8">= the answer keys for eval</text>
  <text x="130" y="160" text-anchor="middle" fill="#475569" font-size="8">(deterministic, regenerable)</text>

  <rect x="30" y="360" width="200" height="70" rx="10" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="130" y="382" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">sources/ YAML</text>
  <text x="130" y="398" text-anchor="middle" fill="#64748b" font-size="8">LLM-ingested &#x2014; the one</text>
  <text x="130" y="412" text-anchor="middle" fill="#64748b" font-size="8">nondeterministic step</text>

  <rect x="30" y="470" width="200" height="70" rx="10" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="130" y="492" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">MCP sessions</text>
  <text x="130" y="508" text-anchor="middle" fill="#64748b" font-size="8">tool-call sequences logged</text>
  <text x="130" y="522" text-anchor="middle" fill="#64748b" font-size="8">to conversations table</text>

  <!-- ============ CENTER: E1..E5 ============ -->
  <!-- E1 blue -->
  <rect x="280" y="80" width="380" height="86" rx="10" fill="#0a1628" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="296" y="102" fill="#60a5fa" font-size="11" font-weight="700">E1 &#x00b7; GROUND TRUTH</text>
  <text x="296" y="118" fill="#94a3b8" font-size="8">LLM generates 5 questions per chunk &#x2192; (question, kb:// uri) pairs</text>
  <text x="296" y="132" fill="#94a3b8" font-size="8">anti-leakage: "use as few words as possible from the record"</text>
  <text x="296" y="146" fill="#94a3b8" font-size="8">versioned golden-queries-vN &#x00b7; validation/test split &#x00b7; ~$1 full corpus</text>
  <text x="296" y="160" fill="#475569" font-size="8">+ ~50 hand-written queries sampled from real sessions</text>

  <line x1="230" y1="132" x2="280" y2="123" stroke="#475569" stroke-width="1.2" marker-end="url(#el1)"/>
  <line x1="470" y1="166" x2="470" y2="190" stroke="#475569" stroke-width="1.2" marker-end="url(#el1)"/>

  <!-- E2 green -->
  <rect x="280" y="190" width="380" height="76" rx="10" fill="#021a12" stroke="#10b981" stroke-width="1.5"/>
  <text x="296" y="212" fill="#34d399" font-size="11" font-weight="700">E2 &#x00b7; RETRIEVAL</text>
  <text x="296" y="228" fill="#94a3b8" font-size="8">Recall@5 / Recall@10 / MRR &#x2014; at page AND chunk granularity</text>
  <text x="296" y="242" fill="#94a3b8" font-size="8">grid-search field boosts on validation split (intuition is often wrong)</text>
  <text x="296" y="256" fill="#475569" font-size="8">honest gate on unsaturated v2 set &#x2014; numbers SHOULD drop at first</text>

  <line x1="470" y1="266" x2="470" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#el1)"/>

  <!-- E3 amber -->
  <rect x="280" y="290" width="380" height="86" rx="10" fill="#1a1400" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="296" y="312" fill="#fbbf24" font-size="11" font-weight="700">E3 &#x00b7; ANSWER QUALITY (LLM-as-judge)</text>
  <text x="296" y="328" fill="#94a3b8" font-size="8">offline per release: A&#x2192;Q&#x2192;A&#x2032; &#x00b7; {reasoning, good|bad} &#x00b7; reason first</text>
  <text x="296" y="342" fill="#94a3b8" font-size="8">online: 1-in-10 sample &#x00b7; async &#x00b7; RELEVANT | PARTLY | NON_RELEVANT</text>
  <text x="296" y="356" fill="#94a3b8" font-size="8">+ /kb-evaluation-judge story-regeneration gate (Chapter 04, unchanged)</text>
  <text x="296" y="370" fill="#475569" font-size="8">calibration: human reviews ~50 verdicts &#x2014; a judge can't judge the judge</text>

  <!-- E4 purple -->
  <rect x="280" y="400" width="380" height="76" rx="10" fill="#0f0a24" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="296" y="422" fill="#a78bfa" font-size="11" font-weight="700">E4 &#x00b7; EXTRACTION FIDELITY (new &#x2014; fixes gap #1)</text>
  <text x="296" y="438" fill="#94a3b8" font-size="8">nightly sample: diff sources/ claims vs OpenAPI / annotations / config</text>
  <text x="296" y="452" fill="#94a3b8" font-size="8">% claims mechanically confirmed &#x2192; trend &#x00b7; unconfirmed &#x21d2; confidence: inferred</text>
  <text x="296" y="466" fill="#475569" font-size="8">prefer deterministic OpenAPI parsing; LLM only fills what specs can't</text>

  <line x1="230" y1="405" x2="280" y2="420" stroke="#475569" stroke-width="1.2" marker-end="url(#el1)"/>

  <!-- E5 pink -->
  <rect x="280" y="500" width="380" height="76" rx="10" fill="#1a0a14" stroke="#ec4899" stroke-width="1.5"/>
  <text x="296" y="522" fill="#f472b6" font-size="11" font-weight="700">E5 &#x00b7; TRAJECTORY (MCP tool use)</text>
  <text x="296" y="538" fill="#94a3b8" font-size="8">rubric: keywords in query &#x00b7; no duplicate calls &#x00b7; refinements only &#x00b7; &#x2264;3 searches</text>
  <text x="296" y="552" fill="#94a3b8" font-size="8">two scores: answer + trajectory &#x2014; wasted-context vs searched-wrong</text>
  <text x="296" y="566" fill="#475569" font-size="8">per framework release &#x00b7; 50-session sample</text>

  <line x1="230" y1="510" x2="280" y2="525" stroke="#475569" stroke-width="1.2" marker-end="url(#el1)"/>

  <!-- ============ RIGHT: GATES & DASHBOARD ============ -->
  <rect x="712" y="190" width="218" height="76" rx="10" fill="#021a12" stroke="#10b981" stroke-width="1.5"/>
  <text x="821" y="212" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">CI GATE</text>
  <text x="821" y="228" text-anchor="middle" fill="#94a3b8" font-size="8">every PR &#x00b7; fails build on regression</text>
  <text x="821" y="242" text-anchor="middle" fill="#94a3b8" font-size="8">vs versioned golden-queries-vN</text>
  <text x="821" y="256" text-anchor="middle" fill="#475569" font-size="8">$0 LLM &#x2014; pure retrieval math</text>
  <line x1="660" y1="228" x2="712" y2="228" stroke="#475569" stroke-width="1.2" marker-end="url(#el1)"/>

  <rect x="712" y="300" width="218" height="66" rx="10" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="821" y="322" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">RELEASE SCORECARD</text>
  <text x="821" y="338" text-anchor="middle" fill="#64748b" font-size="8">E3 + E4 + E5 per KB/framework release</text>
  <text x="821" y="352" text-anchor="middle" fill="#64748b" font-size="8">improve/degrade vs baseline</text>
  <line x1="660" y1="330" x2="712" y2="330" stroke="#475569" stroke-width="1.2" marker-end="url(#el1)"/>
  <line x1="660" y1="435" x2="686" y2="435" stroke="#475569" stroke-width="1"/>
  <line x1="686" y1="435" x2="686" y2="352" stroke="#475569" stroke-width="1"/>
  <line x1="660" y1="535" x2="698" y2="535" stroke="#475569" stroke-width="1"/>
  <line x1="698" y1="535" x2="698" y2="360" stroke="#475569" stroke-width="1"/>

  <!-- Grafana / monitoring -->
  <rect x="712" y="400" width="218" height="176" rx="12" fill="rgba(0,240,255,0.03)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="821" y="424" text-anchor="middle" fill="#00f0ff" font-size="11" font-weight="700">MONITORING</text>
  <text x="821" y="438" text-anchor="middle" fill="#475569" font-size="8">postgres:17 + grafana (docker)</text>
  <text x="728" y="458" fill="#94a3b8" font-size="8">&#x00b7; judge relevance trend / domain</text>
  <text x="728" y="472" fill="#94a3b8" font-size="8">&#x00b7; human-vs-judge agreement (E3)</text>
  <text x="728" y="486" fill="#94a3b8" font-size="8">&#x00b7; E4 fidelity trend</text>
  <text x="728" y="500" fill="#94a3b8" font-size="8">&#x00b7; freshness SLO (D2)</text>
  <text x="728" y="514" fill="#94a3b8" font-size="8">&#x00b7; zero-result queries &#x2190; goldmine</text>
  <text x="728" y="528" fill="#94a3b8" font-size="8">&#x00b7; never-retrieved pages</text>
  <text x="728" y="542" fill="#94a3b8" font-size="8">&#x00b7; thumbs ratio (source='user')</text>
  <text x="728" y="562" fill="#475569" font-size="8">conversations + feedback tables</text>

  <!-- ============ FEEDBACK LOOP ============ -->
  <line x1="821" y1="576" x2="821" y2="636" stroke="#00f0ff" stroke-width="1.2"/>
  <line x1="821" y1="636" x2="150" y2="636" stroke="#00f0ff" stroke-width="1.2"/>
  <line x1="150" y1="636" x2="150" y2="600" stroke="#00f0ff" stroke-width="1.2" marker-end="url(#el2)"/>
  <rect x="60" y="560" width="180" height="40" rx="8" fill="rgba(0,240,255,0.05)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="150" y="577" text-anchor="middle" fill="#00f0ff" font-size="9" font-weight="600">seed.yaml backlog</text>
  <text x="150" y="591" text-anchor="middle" fill="#64748b" font-size="8">ingest what demand proves missing</text>

  <text x="480" y="660" text-anchor="middle" fill="#00f0ff" font-size="10" font-weight="600" filter="url(#elglow)">the loop: real queries with zero results become the ranked backlog for what to ingest next</text>
  <text x="480" y="680" text-anchor="middle" fill="#475569" font-size="9">offline eval proves the KB answers what we imagined &#x00b7; the loop proves it answers what consumers actually ask</text>
</svg>
