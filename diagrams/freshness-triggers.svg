<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'SF Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <marker id="fr1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#475569"/></marker>
    <marker id="fr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#10b981"/></marker>
    <marker id="fr3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f59e0b"/></marker>
    <marker id="fr4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8b5cf6"/></marker>
    <filter id="frglow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="frgrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.5" fill="#1e293b"/></pattern>
  </defs>

  <rect width="960" height="640" fill="#080c14" rx="16"/>
  <rect width="960" height="640" fill="url(#frgrid)" rx="16"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#00f0ff" font-size="18" font-weight="700" filter="url(#frglow)">Freshness Model &#x2014; Detect &#x00b7; Refresh &#x00b7; Backstop</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="10">nightly fingerprint scan &#x00b7; zero cross-team CI changes (S2.3) &#x00b7; TTL demoted from primary defense to backstop</text>

  <!-- ==================== T1 LANE ==================== -->
  <rect x="24" y="76" width="668" height="140" rx="12" fill="rgba(16,185,129,0.03)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <text x="44" y="100" fill="#34d399" font-size="13" font-weight="700">STEP 1 &#x2014; DETECT</text>
  <text x="210" y="100" fill="#475569" font-size="9">nightly scan &#x00b7; change KNOWN &#x2264;24h &#x00b7; ~$0 &#x00b7; read-only</text>

  <rect x="44" y="118" width="180" height="52" rx="8" fill="#021a12" stroke="#10b981" stroke-width="1.2"/>
  <text x="134" y="140" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">seed.yaml repo list</text>
  <text x="134" y="156" text-anchor="middle" fill="#64748b" font-size="8">shallow git pull (45+ repos)</text>

  <line x1="224" y1="144" x2="264" y2="144" stroke="#10b981" stroke-width="1.2" marker-end="url(#fr2)"/>

  <rect x="264" y="118" width="196" height="52" rx="8" fill="#021a12" stroke="#10b981" stroke-width="1.2"/>
  <text x="362" y="140" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">hash ingest-relevant files</text>
  <text x="362" y="156" text-anchor="middle" fill="#64748b" font-size="8">controllers &#x00b7; specs &#x00b7; config &#x00b7; pom</text>

  <line x1="460" y1="144" x2="500" y2="144" stroke="#10b981" stroke-width="1.2" marker-end="url(#fr2)"/>

  <rect x="500" y="118" width="172" height="52" rx="8" fill="#021a12" stroke="#10b981" stroke-width="1.2"/>
  <text x="586" y="140" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">diff .fingerprints.json</text>
  <text x="586" y="156" text-anchor="middle" fill="#64748b" font-size="8">&#x2192; changed-service set</text>

  <text x="44" y="200" fill="#475569" font-size="8">zero changes to service repos &#x2014; deferred upgrade: event dispatch only if the SLO tightens to same-day (S2.3)</text>

  <!-- T1 -> T2 arrow -->
  <line x1="586" y1="170" x2="586" y2="240" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fr2)"/>

  <!-- ==================== T2 LANE ==================== -->
  <rect x="24" y="240" width="668" height="168" rx="12" fill="rgba(245,158,11,0.03)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="44" y="264" fill="#fbbf24" font-size="13" font-weight="700">STEP 2 &#x2014; REFRESH</text>
  <text x="230" y="264" fill="#475569" font-size="9">same nightly job &#x00b7; change INGESTED &#x2264;24h &#x00b7; LLM $ for changed services only</text>

  <rect x="44" y="284" width="150" height="52" rx="8" fill="#1a1400" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="119" y="303" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">scope = changed set</text>
  <text x="119" y="317" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">from step 1</text>
  <text x="119" y="330" text-anchor="middle" fill="#64748b" font-size="8">unchanged services skipped</text>

  <line x1="194" y1="310" x2="228" y2="310" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#fr3)"/>

  <rect x="228" y="284" width="150" height="52" rx="8" fill="#1a1400" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="303" y="306" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">/lifecycle-kb</text>
  <text x="303" y="322" text-anchor="middle" fill="#64748b" font-size="8">--refresh (LLM re-ingest)</text>

  <line x1="378" y1="310" x2="412" y2="310" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#fr3)"/>

  <rect x="412" y="284" width="110" height="52" rx="8" fill="#1a1400" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="467" y="306" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">auto-PR</text>
  <text x="467" y="322" text-anchor="middle" fill="#64748b" font-size="8">sources/ diff only</text>

  <line x1="522" y1="310" x2="556" y2="310" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#fr3)"/>

  <rect x="556" y="284" width="116" height="52" rx="8" fill="#1a1400" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="614" y="303" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">CI gates (kb check)</text>
  <text x="614" y="317" text-anchor="middle" fill="#64748b" font-size="8">schema &#x00b7; audit &#x2265;60</text>
  <text x="614" y="330" text-anchor="middle" fill="#64748b" font-size="8">C1&#x2013;C12 &#x00b7; sync &#x00b7; E2</text>

  <line x1="614" y1="336" x2="614" y2="356" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#fr3)"/>

  <rect x="474" y="356" width="198" height="38" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="573" y="372" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">merge &#x2192; republish bundle</text>
  <text x="573" y="386" text-anchor="middle" fill="#64748b" font-size="8">artifact + registry version bump</text>

  <text x="44" y="372" fill="#475569" font-size="8">same gates as any human PR &#x2014;</text>
  <text x="44" y="386" fill="#475569" font-size="8">nothing stale can merge (sync gate)</text>

  <!-- ==================== T3 LANE ==================== -->
  <rect x="24" y="432" width="668" height="130" rx="12" fill="rgba(139,92,246,0.04)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="44" y="456" fill="#a78bfa" font-size="13" font-weight="700">STEP 3 &#x2014; TTL BACKSTOP</text>
  <text x="270" y="456" fill="#475569" font-size="9">weekly &#x00b7; $0 &#x00b7; should RARELY fire &#x2014; firing means detect/refresh broke</text>

  <rect x="44" y="474" width="140" height="48" rx="8" fill="#0f0a24" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="114" y="494" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">stale_after TTL</text>
  <text x="114" y="508" text-anchor="middle" fill="#64748b" font-size="8">per-type: 60&#x2013;365d</text>

  <line x1="184" y1="498" x2="218" y2="498" stroke="#8b5cf6" stroke-width="1.2" marker-end="url(#fr4)"/>

  <rect x="218" y="474" width="140" height="48" rx="8" fill="#0f0a24" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="288" y="494" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">weekly audit</text>
  <text x="288" y="508" text-anchor="middle" fill="#64748b" font-size="8">D2 freshness metric</text>

  <line x1="358" y1="498" x2="392" y2="498" stroke="#8b5cf6" stroke-width="1.2" marker-end="url(#fr4)"/>

  <rect x="392" y="474" width="140" height="48" rx="8" fill="#0f0a24" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="462" y="494" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">SLO check</text>
  <text x="462" y="508" text-anchor="middle" fill="#64748b" font-size="8">audit now &#x00b7; FED-05 at 2+ domains</text>

  <line x1="532" y1="498" x2="566" y2="498" stroke="#8b5cf6" stroke-width="1.2" marker-end="url(#fr4)"/>

  <rect x="566" y="474" width="106" height="48" rx="8" fill="#0f0a24" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="619" y="494" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">notify OWNER</text>
  <text x="619" y="508" text-anchor="middle" fill="#64748b" font-size="8">CODEOWNERS, not inbox</text>

  <text x="44" y="546" fill="#475569" font-size="8">MCP kb_read_concept keeps flagging pages past stale_after &#x2014; consumers see staleness even if humans ignore it</text>

  <!-- ==================== SLO PANEL ==================== -->
  <rect x="712" y="76" width="224" height="486" rx="12" fill="rgba(0,240,255,0.03)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="824" y="102" text-anchor="middle" fill="#00f0ff" font-size="12" font-weight="700">Freshness SLOs</text>
  <text x="824" y="118" text-anchor="middle" fill="#475569" font-size="8">published per domain in registry.yaml</text>

  <rect x="728" y="136" width="192" height="72" rx="8" fill="#0a1628" stroke="#3b82f6" stroke-width="1"/>
  <text x="824" y="158" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">&#x2265; 95%</text>
  <text x="824" y="174" text-anchor="middle" fill="#94a3b8" font-size="8">pages within TTL</text>
  <text x="824" y="190" text-anchor="middle" fill="#475569" font-size="8">measured by D2 (audit-metrics)</text>

  <rect x="728" y="222" width="192" height="72" rx="8" fill="#0a1628" stroke="#3b82f6" stroke-width="1"/>
  <text x="824" y="244" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">&#x2264; 7 days</text>
  <text x="824" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">service change &#x2192; re-ingested</text>
  <text x="824" y="276" text-anchor="middle" fill="#475569" font-size="8">scan-detect ts vs last_ingested</text>

  <rect x="728" y="308" width="192" height="72" rx="8" fill="#0a1628" stroke="#3b82f6" stroke-width="1"/>
  <text x="824" y="330" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">&#x2264; 1 day</text>
  <text x="824" y="346" text-anchor="middle" fill="#94a3b8" font-size="8">KB merge &#x2192; bundle republished</text>
  <text x="824" y="362" text-anchor="middle" fill="#475569" font-size="8">CI publish job</text>

  <text x="824" y="410" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">surfaced in weekly report</text>
  <text x="824" y="426" text-anchor="middle" fill="#64748b" font-size="8">kb usage-report &#x00b7; D2 trend</text>
  <text x="824" y="440" text-anchor="middle" fill="#64748b" font-size="8">(Grafana at graduation)</text>

  <text x="824" y="480" text-anchor="middle" fill="#00f0ff" font-size="9" font-weight="600">these 3 numbers answer:</text>
  <text x="824" y="496" text-anchor="middle" fill="#64748b" font-size="8">"how do we know the common</text>
  <text x="824" y="510" text-anchor="middle" fill="#64748b" font-size="8">KB stays current?"</text>

  <!-- footer -->
  <text x="480" y="600" text-anchor="middle" fill="#475569" font-size="9">detect nightly &#x2192; refresh nightly &#x2192; TTL catches what slips &#x00b7; 7&#x00d7; SLO headroom with zero footprint in other teams' CI</text>
</svg>
