<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <filter id="glowe2e"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="gride2e" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.5" fill="#1e293b"/></pattern>
  </defs>

  <rect width="900" height="380" fill="#080c14" rx="16"/>
  <rect width="900" height="380" fill="url(#gride2e)" rx="16"/>

  <text x="450" y="36" text-anchor="middle" fill="#00f0ff" font-size="18" font-weight="700" filter="url(#glowe2e)">Feature Lifecycle — KB at Every Stage</text>
  <text x="450" y="54" text-anchor="middle" fill="#64748b" font-size="11">From business requirement to production code</text>

  <!-- Stage boxes in a horizontal flow -->
  <!-- 1. Business Req -->
  <rect x="30" y="80" width="110" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="85" y="105" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">1. REQ</text>
  <line x1="42" y1="112" x2="128" y2="112" stroke="#475569" stroke-width="0.5"/>
  <text x="42" y="128" fill="#94a3b8" font-size="9">ADO Feature ID</text>
  <text x="42" y="143" fill="#94a3b8" font-size="9">SI doc (optional)</text>
  <text x="42" y="158" fill="#94a3b8" font-size="9">JIRA ticket</text>
  <text x="42" y="178" fill="#64748b" font-size="8">KB: not used yet</text>
  <text x="42" y="191" fill="#64748b" font-size="8">(manual input)</text>

  <line x1="140" y1="140" x2="160" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a4)"/>

  <!-- 2. Design -->
  <rect x="160" y="80" width="110" height="120" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="215" y="105" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">2. DESIGN</text>
  <line x1="172" y1="112" x2="258" y2="112" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="172" y="130" fill="#a78bfa" font-size="9">TDD / LLD</text>
  <text x="172" y="146" fill="#fbbf24" font-size="8">future: AI-draft</text>
  <text x="172" y="166" fill="#64748b" font-size="8">KB future use:</text>
  <text x="172" y="179" fill="#64748b" font-size="8">service catalog +</text>
  <text x="172" y="192" fill="#64748b" font-size="8">API patterns</text>

  <line x1="270" y1="140" x2="290" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a4)"/>

  <!-- 3. Stories -->
  <rect x="290" y="80" width="110" height="120" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1.5"/>
  <text x="345" y="100" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="700">3. STORIES</text>
  <line x1="302" y1="108" x2="388" y2="108" stroke="#ea580c" stroke-width="0.5"/>
  <text x="302" y="121" fill="#fb923c" font-size="9">/create-stories</text>
  <text x="302" y="135" fill="#34d399" font-size="8">✓ automated</text>
  <text x="302" y="153" fill="#64748b" font-size="8">KB tools used:</text>
  <text x="302" y="166" fill="#94a3b8" font-size="8">graph_get_service</text>
  <text x="302" y="179" fill="#94a3b8" font-size="8">graph_get_api_contract</text>
  <text x="302" y="192" fill="#94a3b8" font-size="8">graph_semantic_search</text>

  <line x1="400" y1="140" x2="420" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a4)"/>

