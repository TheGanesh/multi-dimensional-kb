<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="'SF Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <marker id="ft1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#475569"/></marker>
    <marker id="ft2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#00f0ff"/></marker>
    <marker id="ft3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#10b981"/></marker>
    <marker id="ft4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f59e0b"/></marker>
    <filter id="ftglow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="ftgrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.5" fill="#1e293b"/></pattern>
  </defs>

  <rect width="960" height="780" fill="#080c14" rx="16"/>
  <rect width="960" height="780" fill="url(#ftgrid)" rx="16"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#00f0ff" font-size="18" font-weight="700" filter="url(#ftglow)">Federation Topology</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="10">domain-owned KB repos &#x00b7; shared framework package &#x00b7; thin central registry &#x00b7; gateway MCP</text>

  <!-- COUNCIL-OWNED chip (framework) -->
  <rect x="30" y="76" width="140" height="18" rx="9" fill="rgba(0,240,255,0.06)" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="100" y="89" text-anchor="middle" fill="#00f0ff" font-size="9" font-weight="700">COUNCIL-OWNED</text>

  <!-- kb-framework box -->
  <rect x="260" y="72" width="440" height="100" rx="10" fill="#0a1628" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="94" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">kb-framework &#x2014; shared platform package</text>
  <text x="480" y="112" text-anchor="middle" fill="#94a3b8" font-size="9">scripts/ &#x00b7; kbcli/ &#x00b7; graph-mcp/ &#x00b7; JSON schemas &#x00b7; templates/ &#x00b7; eval harness</text>
  <text x="480" y="128" text-anchor="middle" fill="#94a3b8" font-size="9">10 workflow definitions &#x00b7; kb init &#x2192; scaffolds a new domain repo</text>
  <text x="480" y="150" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="600">internal PyPI &#x00b7; semver releases &#x00b7; domains pin versions</text>

  <!-- pin arrows framework -> domains -->
  <line x1="330" y1="172" x2="170" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#ft1)"/>
  <line x1="480" y1="172" x2="480" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#ft1)"/>
  <line x1="630" y1="172" x2="790" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#ft1)"/>
  <text x="480" y="210" text-anchor="middle" fill="#64748b" font-size="9">pip install kb-framework==2.1.0</text>

  <!-- DOMAIN-OWNED chip -->
  <rect x="30" y="222" width="140" height="18" rx="9" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="100" y="235" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">DOMAIN-OWNED</text>

  <!-- commerce-kb -->
  <rect x="30" y="248" width="280" height="180" rx="10" fill="#021a12" stroke="#10b981" stroke-width="1.5"/>
  <text x="170" y="270" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">commerce-kb</text>
  <text x="170" y="284" text-anchor="middle" fill="#475569" font-size="8">apm0045079 &#x00b7; owned by Commerce team</text>
  <text x="46" y="304" fill="#94a3b8" font-size="9">seed.yaml            declared inputs</text>
  <text x="46" y="320" fill="#94a3b8" font-size="9">sources/     (L1)    team edits via PR</text>
  <text x="46" y="336" fill="#94a3b8" font-size="9">markdown/    (L2)    generated bundle</text>
  <text x="46" y="352" fill="#94a3b8" font-size="9">eval/golden-queries-vN   versioned</text>
  <text x="46" y="368" fill="#94a3b8" font-size="9">CODEOWNERS           enforced</text>
  <text x="46" y="384" fill="#94a3b8" font-size="9">CI: 6 jobs from kb-framework</text>
  <text x="46" y="406" fill="#10b981" font-size="9" font-weight="600">MCP :8787 &#x2014; commerce index only</text>

  <!-- customer-kb -->
  <rect x="340" y="248" width="280" height="180" rx="10" fill="#021a12" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="270" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">customer-kb</text>
  <text x="480" y="284" text-anchor="middle" fill="#475569" font-size="8">owned by Customer team</text>
  <text x="356" y="304" fill="#94a3b8" font-size="9">seed.yaml</text>
  <text x="356" y="320" fill="#94a3b8" font-size="9">sources/     (L1)</text>
  <text x="356" y="336" fill="#94a3b8" font-size="9">markdown/    (L2)</text>
  <text x="356" y="352" fill="#94a3b8" font-size="9">eval/golden-queries-vN</text>
  <text x="356" y="368" fill="#94a3b8" font-size="9">CODEOWNERS</text>
  <text x="356" y="384" fill="#94a3b8" font-size="9">CI: same 6 jobs &#x00b7; zero code changes</text>
  <text x="356" y="406" fill="#10b981" font-size="9" font-weight="600">MCP :8788 &#x2014; customer index only</text>

  <!-- order-kb -->
  <rect x="650" y="248" width="280" height="180" rx="10" fill="#021a12" stroke="#10b981" stroke-width="1.5"/>
  <text x="790" y="270" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">order-kb</text>
  <text x="790" y="284" text-anchor="middle" fill="#475569" font-size="8">owned by Order team</text>
  <text x="666" y="304" fill="#94a3b8" font-size="9">seed.yaml</text>
  <text x="666" y="320" fill="#94a3b8" font-size="9">sources/     (L1)</text>
  <text x="666" y="336" fill="#94a3b8" font-size="9">markdown/    (L2)</text>
  <text x="666" y="352" fill="#94a3b8" font-size="9">eval/golden-queries-vN</text>
  <text x="666" y="368" fill="#94a3b8" font-size="9">CODEOWNERS</text>
  <text x="666" y="384" fill="#94a3b8" font-size="9">CI: same 6 jobs</text>
  <text x="666" y="406" fill="#10b981" font-size="9" font-weight="600">MCP :8789 &#x2014; order index only</text>

  <!-- publish arrows -->
  <line x1="170" y1="428" x2="170" y2="490" stroke="#10b981" stroke-width="1.2" marker-end="url(#ft3)"/>
  <line x1="480" y1="428" x2="480" y2="490" stroke="#10b981" stroke-width="1.2" marker-end="url(#ft3)"/>
  <line x1="790" y1="428" x2="790" y2="490" stroke="#10b981" stroke-width="1.2" marker-end="url(#ft3)"/>
  <text x="480" y="470" text-anchor="middle" fill="#64748b" font-size="9">CI publish job &#x2192; versioned bundle artifact (consumers never clone domain repos)</text>

  <!-- COUNCIL-OWNED chip (registry) -->
  <rect x="30" y="472" width="140" height="18" rx="9" fill="rgba(0,240,255,0.06)" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="100" y="485" text-anchor="middle" fill="#00f0ff" font-size="9" font-weight="700">COUNCIL-OWNED</text>

  <!-- registry panel -->
  <rect x="30" y="496" width="900" height="140" rx="12" fill="rgba(0,240,255,0.03)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="480" y="518" text-anchor="middle" fill="#00f0ff" font-size="12" font-weight="700">kb-registry &#x2014; thin central federation</text>

  <text x="54" y="540" fill="#e2e8f0" font-size="10" font-weight="600">registry.yaml</text>
  <text x="54" y="556" fill="#94a3b8" font-size="8">domain &#x2192; repo &#x00b7; owner &#x00b7; bundle</text>
  <text x="54" y="570" fill="#94a3b8" font-size="8">&#x00b7; MCP endpoint &#x00b7; freshness SLO</text>
  <text x="54" y="584" fill="#94a3b8" font-size="8">&#x00b7; framework_min_version</text>
  <text x="54" y="604" fill="#475569" font-size="8">one reviewable file = federation state</text>

  <text x="360" y="540" fill="#e2e8f0" font-size="10" font-weight="600">federation CI (nightly)</text>
  <text x="360" y="556" fill="#94a3b8" font-size="8">FED-01 registry schema valid</text>
  <text x="360" y="570" fill="#94a3b8" font-size="8">FED-02 bundles pass C1&#x2013;C12</text>
  <text x="360" y="584" fill="#94a3b8" font-size="8">FED-03 cross-domain kb:// links resolve</text>
  <text x="360" y="598" fill="#94a3b8" font-size="8">FED-04 framework version floor</text>
  <text x="360" y="612" fill="#94a3b8" font-size="8">FED-05 freshness SLO &#x2192; notify owner</text>
  <text x="360" y="626" fill="#475569" font-size="7">FED-03&#x2026;05 activate at 2nd domain &#x00b7; registry.yaml lives in kb-framework until then (S3.1)</text>

  <text x="660" y="540" fill="#e2e8f0" font-size="10" font-weight="600">bundle artifacts (Artifactory)</text>
  <text x="660" y="556" fill="#94a3b8" font-size="8">commerce@7.1.0</text>
  <text x="660" y="570" fill="#94a3b8" font-size="8">customer@1.3.0</text>
  <text x="660" y="584" fill="#94a3b8" font-size="8">order@0.9.0</text>
  <text x="660" y="604" fill="#475569" font-size="8">consumers may pin versions</text>

  <!-- consumers + gateway row -->
  <rect x="30" y="668" width="240" height="76" rx="10" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="150" y="692" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Consumers</text>
  <text x="150" y="708" text-anchor="middle" fill="#64748b" font-size="8">IDE agents &#x00b7; story gen &#x00b7; plans &#x00b7; scaffold</text>
  <text x="150" y="722" text-anchor="middle" fill="#64748b" font-size="8">in-domain work &#x2192; that domain's MCP only</text>

  <rect x="330" y="668" width="440" height="76" rx="10" fill="#1a1400" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="690" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">kb-gateway MCP (cross-domain only)</text>
  <text x="550" y="706" text-anchor="middle" fill="#94a3b8" font-size="8">kb_route: classify &#x2192; domain(s) &#x00b7; kb_federated_search: fan-out &#x2264;2 &#x2192; W-RRF merge</text>
  <text x="550" y="720" text-anchor="middle" fill="#94a3b8" font-size="8">returns disclosure lines + kb:// URIs first &#x2014; agent pulls full pages deliberately</text>
  <text x="550" y="736" text-anchor="middle" fill="#475569" font-size="8">no index of its own &#x00b7; deferred (S3.1): build at &#x2265;2 domains + logged cross-domain demand</text>

  <line x1="270" y1="706" x2="330" y2="706" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#ft4)"/>
  <text x="300" y="698" text-anchor="middle" fill="#64748b" font-size="7">x-domain</text>

  <line x1="550" y1="668" x2="550" y2="636" stroke="#00f0ff" stroke-width="1" marker-end="url(#ft2)"/>
  <text x="600" y="656" fill="#475569" font-size="8">reads registry</text>

  <!-- context pollution note -->
  <text x="820" y="700" text-anchor="middle" fill="#00f0ff" font-size="9" font-weight="600">context-pollution control:</text>
  <text x="820" y="716" text-anchor="middle" fill="#64748b" font-size="8">scoped index (structural) +</text>
  <text x="820" y="730" text-anchor="middle" fill="#64748b" font-size="8">disclosure-first (behavioral)</text>
</svg>
