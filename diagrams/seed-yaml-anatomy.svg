<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <marker id="sy1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <filter id="glowsy"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="gridsy" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.5" fill="#1e293b"/></pattern>
  </defs>

  <rect width="960" height="480" fill="#080c14" rx="16"/>
  <rect width="960" height="480" fill="url(#gridsy)" rx="16"/>

  <text x="480" y="36" text-anchor="middle" fill="#00f0ff" font-size="18" font-weight="700" filter="url(#glowsy)">seed.yaml — The Single Input File</text>
  <text x="480" y="54" text-anchor="middle" fill="#64748b" font-size="11">Edit this one file. Run workflows. Everything else is derived.</text>

  <!-- seed.yaml center -->
  <rect x="370" y="72" width="220" height="50" rx="10" fill="#431407" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="700">templates/seed.yaml</text>
  <text x="480" y="113" text-anchor="middle" fill="#64748b" font-size="9">THE SINGLE INPUT — every source explicitly declared</text>

  <!-- 6 sections radiating out -->
  <!-- Section 0: kb config -->
  <rect x="30" y="75" width="180" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="120" y="96" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">§0  kb:</text>
  <text x="40" y="114" fill="#94a3b8" font-size="9">domain, apmId, kbRoot</text>
  <text x="40" y="126" fill="#64748b" font-size="8">Identity + output location</text>
  <line x1="210" y1="97" x2="370" y2="97" stroke="#475569" stroke-width="1" marker-end="url(#sy1)"/>

  <!-- Section 1: services -->
  <rect x="30" y="155" width="300" height="95" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="176" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">§1  services: (45 entries)</text>
  <text x="42" y="194" fill="#a78bfa" font-size="10">- name: shoppingcartms</text>
  <text x="42" y="208" fill="#a78bfa" font-size="9">  repoPath: ../apm0045080-commercsox-...</text>
  <text x="42" y="222" fill="#a78bfa" font-size="10">  subdomain: cart-checkout</text>
  <text x="42" y="238" fill="#64748b" font-size="7">→ /ingest-service scans Java repos → catalog-info.yaml + api-contracts</text>

  <!-- Section 2: wiki -->
  <rect x="30" y="264" width="300" height="80" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="285" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">§2  wiki: (Confluence pages)</text>
  <text x="42" y="303" fill="#60a5fa" font-size="10">pages: [{url, dimension, service, depth}]</text>
  <text x="42" y="318" fill="#60a5fa" font-size="10">local: [{path, dimension}]</text>
  <text x="42" y="330" fill="#64748b" font-size="7.5">→ /ingest-wiki crawls via LevelUp MCP</text>
  <text x="42" y="341" fill="#64748b" font-size="7.5">  → wiki-crawled + api-contracts</text>

  <!-- Section 3: bruno -->
  <rect x="360" y="155" width="270" height="80" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
  <text x="495" y="176" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">§3  bruno: (API collections)</text>
  <text x="372" y="194" fill="#34d399" font-size="10">repoPath: ../api-collections</text>
  <text x="372" y="210" fill="#34d399" font-size="10">items: [{dir, service|flow}]</text>
  <text x="372" y="226" fill="#64748b" font-size="7">→ /ingest-bruno parses .bru → capability-flow + bruno-parsed</text>

  <!-- Section 4: adrs -->
  <rect x="360" y="250" width="130" height="56" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1.2"/>
  <text x="425" y="271" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">§4  adrs:</text>
  <text x="372" y="289" fill="#fb923c" font-size="9">basePath: adr/</text>
  <text x="372" y="300" fill="#64748b" font-size="8">pattern: *.md</text>

  <!-- Section 5: nfrs -->
  <rect x="500" y="250" width="130" height="56" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1.2"/>
  <text x="565" y="271" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">§5  nfrs:</text>
  <text x="512" y="289" fill="#fb923c" font-size="9">basePath: nfr/</text>
  <text x="512" y="300" fill="#64748b" font-size="8">pattern: *.md</text>

  <!-- Section 6: metadata -->
  <rect x="660" y="155" width="270" height="80" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1.2"/>
  <text x="795" y="176" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">§6  metadata:</text>
  <text x="672" y="194" fill="#60a5fa" font-size="10">basePath: graph-metadata</text>
  <text x="672" y="210" fill="#60a5fa" font-size="10">patterns: [*.json, *.md, *.html]</text>
  <text x="672" y="226" fill="#64748b" font-size="8">→ /ingest-auxiliary → sources/metadata/ YAML</text>

  <!-- Connecting lines from seed to sections -->
  <line x1="480" y1="122" x2="480" y2="155" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="370" y1="97" x2="330" y2="97" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- How to add new source -->
  <rect x="30" y="365" width="900" height="100" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1"/>
  <text x="50" y="388" fill="#fde68a" font-size="13" font-weight="700">How to Add a New Source</text>

  <text x="50" y="410" fill="#94a3b8" font-size="10">New service → add entry under services: [{name, repoPath, subdomain}] → /ingest-service {name} → /generate-kb --scope={name}</text>
  <text x="50" y="427" fill="#94a3b8" font-size="10">New wiki page → add entry under wiki: [{url, dimension, service, depth}] → /ingest-wiki {url} → /generate-kb</text>
  <text x="50" y="444" fill="#94a3b8" font-size="10">New Bruno collection → add entry under bruno.items: [{dir, service|flow}] → /ingest-bruno {dir} → /generate-kb</text>
  <text x="50" y="461" fill="#94a3b8" font-size="10">New ADR/NFR → drop .md in adr/ or nfr/ (auto-picked by glob) → /ingest-auxiliary {type} {path} → /generate-kb</text>
</svg>
