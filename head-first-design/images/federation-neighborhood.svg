<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <rect width="900" height="520" fill="#fdf8ec" rx="18"/>

  <text x="450" y="40" text-anchor="middle" fill="#33302b" font-size="24" font-weight="700">Same blueprint. Separate houses. One-page registry.</text>

  <!-- blueprint -->
  <g transform="rotate(-3 165 130)">
    <rect x="70" y="80" width="190" height="110" fill="#cfe6ff" stroke="#2b7de0" stroke-width="3" rx="8"/>
    <text x="165" y="108" text-anchor="middle" fill="#1d4e89" font-size="14" font-weight="700">THE BLUEPRINT</text>
    <text x="165" y="128" text-anchor="middle" fill="#1d4e89" font-size="12">kb-framework v2.1.0</text>
    <g stroke="#1d4e89" stroke-width="1.5" fill="none">
      <rect x="100" y="140" width="40" height="30"/>
      <polygon points="95,140 145,140 120,122"/>
      <line x1="150" y1="170" x2="230" y2="170"/>
      <line x1="150" y1="155" x2="230" y2="155"/>
    </g>
    <text x="165" y="184" text-anchor="middle" fill="#1d4e89" font-size="10">generator &#x00b7; CLI &#x00b7; search &#x00b7; exams</text>
  </g>
  <!-- arrows blueprint -> houses -->
  <g stroke="#2b7de0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="7 6">
    <path d="M 220 200 Q 250 250 260 290"/>
    <path d="M 265 160 Q 420 190 460 285"/>
    <path d="M 268 140 Q 560 150 665 282"/>
  </g>
  <text x="352" y="240" fill="#2b7de0" font-size="12" font-weight="700">pip install (each house pins a version)</text>

  <!-- three houses -->
  <!-- commerce house -->
  <g stroke="#33302b" stroke-width="3" stroke-linecap="round">
    <polygon points="190,340 260,290 330,340" fill="#ffd9c4"/>
    <rect x="205" y="340" width="110" height="90" fill="#ffffff"/>
    <rect x="245" y="380" width="30" height="50" fill="#e0533d"/>
    <rect x="215" y="352" width="26" height="22" fill="#cfe6ff"/>
    <rect x="280" y="352" width="26" height="22" fill="#cfe6ff"/>
  </g>
  <text x="260" y="452" text-anchor="middle" fill="#b03621" font-size="14" font-weight="700">commerce-kb</text>
  <text x="260" y="470" text-anchor="middle" fill="#8a8478" font-size="11">owned by Commerce team</text>
  <text x="260" y="330" text-anchor="middle" fill="#33302b" font-size="11" font-weight="700">kb://commerce/&#x2026;</text>

  <!-- customer house -->
  <g stroke="#33302b" stroke-width="3" stroke-linecap="round">
    <polygon points="390,340 460,290 530,340" fill="#dff2e4"/>
    <rect x="405" y="340" width="110" height="90" fill="#ffffff"/>
    <rect x="445" y="380" width="30" height="50" fill="#3fa060"/>
    <rect x="415" y="352" width="26" height="22" fill="#cfe6ff"/>
    <rect x="480" y="352" width="26" height="22" fill="#cfe6ff"/>
  </g>
  <text x="460" y="452" text-anchor="middle" fill="#2a7a48" font-size="14" font-weight="700">customer-kb</text>
  <text x="460" y="470" text-anchor="middle" fill="#8a8478" font-size="11">owned by Customer team</text>
  <text x="460" y="330" text-anchor="middle" fill="#33302b" font-size="11" font-weight="700">kb://customer/&#x2026;</text>

  <!-- order house -->
  <g stroke="#33302b" stroke-width="3" stroke-linecap="round">
    <polygon points="595,340 665,290 735,340" fill="#e9defa"/>
    <rect x="610" y="340" width="110" height="90" fill="#ffffff"/>
    <rect x="650" y="380" width="30" height="50" fill="#8a5cc0"/>
    <rect x="620" y="352" width="26" height="22" fill="#cfe6ff"/>
    <rect x="685" y="352" width="26" height="22" fill="#cfe6ff"/>
  </g>
  <text x="665" y="452" text-anchor="middle" fill="#6a3fa0" font-size="14" font-weight="700">order-kb</text>
  <text x="665" y="470" text-anchor="middle" fill="#8a8478" font-size="11">owned by Order team</text>
  <text x="665" y="330" text-anchor="middle" fill="#33302b" font-size="11" font-weight="700">kb://order/&#x2026;</text>

  <!-- fences -->
  <g stroke="#8a8478" stroke-width="2.5" stroke-linecap="round">
    <line x1="355" y1="395" x2="355" y2="432"/><line x1="368" y1="395" x2="368" y2="432"/><line x1="348" y1="408" x2="376" y2="408"/>
    <line x1="558" y1="395" x2="558" y2="432"/><line x1="571" y1="395" x2="571" y2="432"/><line x1="551" y1="408" x2="579" y2="408"/>
  </g>

  <!-- registry at city hall -->
  <g transform="rotate(2 810 150)">
    <rect x="740" y="90" width="140" height="120" fill="#fff3a8" stroke="#d8c04a" stroke-width="3" rx="8"/>
    <text x="810" y="116" text-anchor="middle" fill="#6b5900" font-size="13" font-weight="700">CITY REGISTRY</text>
    <text x="810" y="136" text-anchor="middle" fill="#6b5900" font-size="11.5">registry.yaml</text>
    <text x="810" y="158" text-anchor="middle" fill="#8a6d00" font-size="10.5">commerce &#x2192; owner, v7.1</text>
    <text x="810" y="176" text-anchor="middle" fill="#8a6d00" font-size="10.5">customer &#x2192; owner, v1.3</text>
    <text x="810" y="194" text-anchor="middle" fill="#8a6d00" font-size="10.5">order &#x2192; owner, v0.9</text>
  </g>
  <text x="810" y="228" text-anchor="middle" fill="#8a8478" font-size="10.5">the ENTIRE central database</text>

  <!-- concierge -->
  <g stroke="#33302b" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="120" cy="330" r="26" fill="#ffffff"/>
    <circle cx="112" cy="326" r="2.5" fill="#33302b"/>
    <circle cx="128" cy="326" r="2.5" fill="#33302b"/>
    <path d="M 111 340 Q 120 346 129 340"/>
    <rect x="104" y="300" width="32" height="10" fill="#8a5cc0" stroke="#33302b" stroke-width="2"/>
    <line x1="120" y1="356" x2="120" y2="410"/>
    <line x1="120" y1="374" x2="96" y2="392"/>
    <line x1="120" y1="374" x2="144" y2="392"/>
    <line x1="120" y1="410" x2="106" y2="448"/>
    <line x1="120" y1="410" x2="134" y2="448"/>
  </g>
  <g>
    <rect x="30" y="230" width="185" height="58" fill="#ffffff" stroke="#33302b" stroke-width="2.5" rx="14"/>
    <polygon points="110,288 126,288 118,304" fill="#ffffff" stroke="#33302b" stroke-width="2.5"/>
    <rect x="112" y="285" width="12" height="5" fill="#ffffff"/>
    <text x="122" y="252" text-anchor="middle" fill="#33302b" font-size="12" font-weight="700">"Headlines first.</text>
    <text x="122" y="272" text-anchor="middle" fill="#33302b" font-size="12" font-weight="700">Furniture on request."</text>
  </g>
  <text x="120" y="482" text-anchor="middle" fill="#8a5cc0" font-size="12" font-weight="700">the concierge (gateway)</text>
  <text x="120" y="500" text-anchor="middle" fill="#8a8478" font-size="10.5">designed &#x00b7; not hired yet</text>

  <text x="560" y="504" text-anchor="middle" fill="#8a8478" font-size="12.5">same building code, inspected at every house &#x2014; no central approvals desk</text>
</svg>
