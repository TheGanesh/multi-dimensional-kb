<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <rect width="900" height="480" fill="#fdf8ec" rx="18"/>

  <text x="450" y="42" text-anchor="middle" fill="#33302b" font-size="24" font-weight="700">Where do I find what shoppingcartms does?</text>

  <!-- Sam -->
  <g stroke="#33302b" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="120" cy="150" r="34" fill="#ffffff"/>
    <circle cx="109" cy="146" r="3" fill="#33302b"/>
    <circle cx="131" cy="146" r="3" fill="#33302b"/>
    <path d="M 108 166 Q 120 160 132 166"/>                     <!-- worried mouth -->
    <path d="M 100 132 Q 108 124 116 130" />                     <!-- brow -->
    <line x1="120" y1="184" x2="120" y2="260"/>
    <line x1="120" y1="205" x2="85" y2="240"/>
    <line x1="120" y1="205" x2="155" y2="240"/>
    <line x1="120" y1="260" x2="98" y2="315"/>
    <line x1="120" y1="260" x2="142" y2="315"/>
  </g>
  <text x="120" y="345" text-anchor="middle" fill="#8a5cc0" font-size="14" font-weight="700">Sam, day one</text>
  <text x="120" y="118" text-anchor="middle" fill="#33302b" font-size="26">?</text>

  <!-- five sources, tombstone-ish tilted cards -->
  <g transform="rotate(-6 320 170)">
    <rect x="250" y="120" width="150" height="92" fill="#ffffff" stroke="#33302b" stroke-width="2.5" rx="10"/>
    <text x="325" y="150" text-anchor="middle" fill="#33302b" font-size="15" font-weight="700">Confluence page</text>
    <text x="325" y="172" text-anchor="middle" fill="#8a8478" font-size="12">last edited: 2023</text>
    <text x="325" y="192" text-anchor="middle" fill="#e0533d" font-size="12" font-weight="700">port is WRONG</text>
  </g>

  <g transform="rotate(4 500 160)">
    <rect x="430" y="112" width="150" height="92" fill="#ffffff" stroke="#33302b" stroke-width="2.5" rx="10"/>
    <text x="505" y="142" text-anchor="middle" fill="#33302b" font-size="15" font-weight="700">"Read the code"</text>
    <text x="505" y="164" text-anchor="middle" fill="#8a8478" font-size="12">45 repos</text>
    <text x="505" y="184" text-anchor="middle" fill="#e0533d" font-size="12" font-weight="700">see you in June</text>
  </g>

  <g transform="rotate(-3 680 170)">
    <rect x="610" y="120" width="150" height="92" fill="#ffffff" stroke="#33302b" stroke-width="2.5" rx="10"/>
    <text x="685" y="150" text-anchor="middle" fill="#33302b" font-size="15" font-weight="700">"Ask Priya"</text>
    <text x="685" y="172" text-anchor="middle" fill="#8a8478" font-size="12">Priya left in March</text>
    <text x="685" y="192" text-anchor="middle" fill="#e0533d" font-size="12" font-weight="700">knowledge: gone</text>
  </g>

  <g transform="rotate(5 380 300)">
    <rect x="310" y="255" width="150" height="86" fill="#ffffff" stroke="#33302b" stroke-width="2.5" rx="10"/>
    <text x="385" y="285" text-anchor="middle" fill="#33302b" font-size="15" font-weight="700">Bruno collection</text>
    <text x="385" y="307" text-anchor="middle" fill="#8a8478" font-size="12">"somewhere"</text>
    <text x="385" y="326" text-anchor="middle" fill="#f0a500" font-size="12" font-weight="700">actually useful!</text>
  </g>

  <g transform="rotate(-5 560 300)">
    <rect x="490" y="255" width="150" height="86" fill="#ffffff" stroke="#33302b" stroke-width="2.5" rx="10"/>
    <text x="565" y="285" text-anchor="middle" fill="#33302b" font-size="15" font-weight="700">Tribal memory</text>
    <text x="565" y="307" text-anchor="middle" fill="#8a8478" font-size="12">"ignore the wiki,</text>
    <text x="565" y="325" text-anchor="middle" fill="#8a8478" font-size="12">it's 8443 now"</text>
  </g>

  <!-- Botty with hallucination bubble -->
  <g stroke="#33302b" stroke-width="3" fill="#ffffff" stroke-linecap="round">
    <rect x="740" y="290" width="70" height="56" rx="10"/>
    <line x1="775" y1="290" x2="775" y2="274"/>
    <circle cx="775" cy="267" r="5" fill="#2b7de0"/>
    <circle cx="760" cy="312" r="4.5" fill="#2b7de0"/>
    <circle cx="790" cy="312" r="4.5" fill="#2b7de0"/>
    <path d="M 760 330 Q 775 338 790 330" fill="none"/>
    <rect x="748" y="346" width="54" height="42" rx="8"/>
  </g>
  <g>
    <rect x="640" y="380" width="230" height="58" fill="#ffe3de" stroke="#e0533d" stroke-width="2.5" rx="14"/>
    <polygon points="790,380 806,380 796,362" fill="#ffe3de" stroke="#e0533d" stroke-width="2.5"/>
    <rect x="792" y="378" width="12" height="5" fill="#ffe3de"/>
    <text x="755" y="404" text-anchor="middle" fill="#b03621" font-size="14" font-weight="700">I'll just call getCartDiscountsV2!</text>
    <text x="755" y="426" text-anchor="middle" fill="#b03621" font-size="12">(narrator: it does not exist)</text>
  </g>

  <!-- moral sticky note -->
  <g transform="rotate(-2 150 420)">
    <rect x="40" y="385" width="230" height="72" fill="#fff3a8" stroke="#d8c04a" stroke-width="2.5" rx="6"/>
    <text x="155" y="414" text-anchor="middle" fill="#6b5900" font-size="14" font-weight="700">The docs aren't missing.</text>
    <text x="155" y="438" text-anchor="middle" fill="#6b5900" font-size="14" font-weight="700">They're UNTRUSTWORTHY.</text>
  </g>
</svg>
