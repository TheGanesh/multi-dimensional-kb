<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <rect width="900" height="500" fill="#fdf8ec" rx="18"/>

  <text x="450" y="40" text-anchor="middle" fill="#33302b" font-size="24" font-weight="700">Don't let robots into the kitchen. Hand them a menu.</text>

  <!-- BEFORE: kitchen chaos -->
  <text x="215" y="82" text-anchor="middle" fill="#b03621" font-size="17" font-weight="700">BEFORE: rummaging</text>
  <g stroke="#33302b" stroke-width="2.5" fill="#ffffff" stroke-linecap="round">
    <!-- cabinet -->
    <rect x="60" y="100" width="140" height="180" rx="8"/>
    <line x1="60" y1="160" x2="200" y2="160"/>
    <line x1="60" y1="220" x2="200" y2="220"/>
    <!-- open drawer with papers -->
    <rect x="80" y="170" width="140" height="34" fill="#ffe9d6"/>
    <path d="M 100 170 L 108 150 M 130 170 L 136 148 M 160 170 L 170 152" stroke="#8a8478" stroke-width="2"/>
  </g>
  <!-- messy Botty -->
  <g stroke="#33302b" stroke-width="3" fill="#ffffff" stroke-linecap="round">
    <rect x="250" y="150" width="66" height="54" rx="10"/>
    <line x1="283" y1="150" x2="283" y2="136"/>
    <circle cx="283" cy="129" r="5" fill="#e0533d"/>
    <circle cx="268" cy="172" r="4" fill="#e0533d"/>
    <circle cx="298" cy="172" r="4" fill="#e0533d"/>
    <path d="M 268 190 Q 283 184 298 190" fill="none"/>   <!-- frown -->
    <rect x="258" y="204" width="50" height="40" rx="8"/>
  </g>
  <!-- papers flying -->
  <g transform="rotate(-14 340 130)"><rect x="322" y="118" width="40" height="26" fill="#ffffff" stroke="#8a8478" stroke-width="2"/></g>
  <g transform="rotate(10 350 190)"><rect x="330" y="178" width="40" height="26" fill="#ffffff" stroke="#8a8478" stroke-width="2"/></g>
  <g transform="rotate(-8 330 240)"><rect x="312" y="228" width="40" height="26" fill="#ffffff" stroke="#8a8478" stroke-width="2"/></g>
  <g>
    <rect x="228" y="66" width="180" height="40" fill="#ffe3de" stroke="#e0533d" stroke-width="2.5" rx="12"/>
    <text x="318" y="92" text-anchor="middle" fill="#b03621" font-size="12.5" font-weight="700">brain full of drawer junk</text>
  </g>
  <text x="215" y="310" text-anchor="middle" fill="#8a8478" font-size="12">reads 12 files &#x00b7; keeps 1 fact &#x00b7; confuses 2 services</text>

  <!-- divider -->
  <line x1="435" y1="70" x2="435" y2="440" stroke="#d8cfc0" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- AFTER: the menu -->
  <text x="670" y="82" text-anchor="middle" fill="#2a7a48" font-size="17" font-weight="700">AFTER: ordering from the menu</text>

  <!-- menu board -->
  <g>
    <rect x="470" y="100" width="230" height="270" fill="#ffffff" stroke="#33302b" stroke-width="3" rx="12"/>
    <rect x="470" y="100" width="230" height="40" fill="#dff2e4" stroke="#33302b" stroke-width="3" rx="12"/>
    <rect x="470" y="122" width="230" height="18" fill="#dff2e4"/>
    <text x="585" y="127" text-anchor="middle" fill="#2a7a48" font-size="15" font-weight="700">MCP MENU &#x2014; 9 dishes</text>
    <text x="486" y="165" fill="#33302b" font-size="13">kb_list &#x00b7; kb_get</text>
    <text x="486" y="190" fill="#33302b" font-size="13">kb_search &#x00b7; kb_smart_query</text>
    <text x="486" y="215" fill="#33302b" font-size="13">kb_navigate &#x00b7; kb_read_concept</text>
    <text x="486" y="240" fill="#33302b" font-size="13">kb_impact &#x00b7; kb_compare</text>
    <text x="486" y="265" fill="#33302b" font-size="13">kb_health</text>
    <line x1="486" y1="285" x2="684" y2="285" stroke="#d8cfc0" stroke-width="2"/>
    <text x="585" y="310" text-anchor="middle" fill="#8a8478" font-size="11.5">every dish served structured,</text>
    <text x="585" y="328" text-anchor="middle" fill="#8a8478" font-size="11.5">with address + trust label</text>
    <text x="585" y="352" text-anchor="middle" fill="#e0533d" font-size="11.5" font-weight="700">stale page? comes with a warning</text>
  </g>

  <!-- happy Botty ordering -->
  <g stroke="#33302b" stroke-width="3" fill="#ffffff" stroke-linecap="round">
    <rect x="760" y="180" width="66" height="54" rx="10"/>
    <line x1="793" y1="180" x2="793" y2="166"/>
    <circle cx="793" cy="159" r="5" fill="#2b7de0"/>
    <circle cx="778" cy="202" r="4" fill="#2b7de0"/>
    <circle cx="808" cy="202" r="4" fill="#2b7de0"/>
    <path d="M 778 216 Q 793 226 808 216" fill="none"/>   <!-- smile -->
    <rect x="768" y="234" width="50" height="40" rx="8"/>
    <line x1="768" y1="250" x2="740" y2="236"/>            <!-- arm pointing at menu -->
  </g>
  <g>
    <rect x="716" y="96" width="164" height="58" fill="#ffffff" stroke="#33302b" stroke-width="2.5" rx="14"/>
    <polygon points="784,154 800,154 792,172" fill="#ffffff" stroke="#33302b" stroke-width="2.5"/>
    <rect x="786" y="151" width="12" height="5" fill="#ffffff"/>
    <text x="798" y="118" text-anchor="middle" fill="#33302b" font-size="12.5" font-weight="700">"kb_get, service,</text>
    <text x="798" y="138" text-anchor="middle" fill="#33302b" font-size="12.5" font-weight="700">shoppingcartms please"</text>
  </g>
  <text x="793" y="300" text-anchor="middle" fill="#2a7a48" font-size="12" font-weight="700">1 call &#x00b7; 1 exact answer</text>
  <text x="793" y="318" text-anchor="middle" fill="#2a7a48" font-size="12" font-weight="700">tidy brain</text>

  <!-- footer -->
  <text x="450" y="470" text-anchor="middle" fill="#8a8478" font-size="13">MCP = the standard menu format every AI waiter already reads (Linux Foundation standard)</text>
</svg>
