<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Avenir Next','Trebuchet MS',Verdana,sans-serif">
  <rect width="900" height="560" fill="#fbf7ec" rx="18"/>
  <rect x="18" y="18" width="864" height="524" fill="none" stroke="#e3d9bf" stroke-width="2" rx="12"/>

  <text x="450" y="86" text-anchor="middle" fill="#2f2c26" font-size="36" font-weight="700">The Commerce Knowledge Base</text>
  <text x="450" y="118" text-anchor="middle" fill="#8a8478" font-size="16">brain-friendly on top &#183; engineering-grade underneath</text>

  <!-- cake stack -->
  <ellipse cx="300" cy="430" rx="190" ry="18" fill="#ffffff" stroke="#2f2c26" stroke-width="2.5"/>
  <rect x="160" y="350" width="280" height="74" fill="#d9e9fb" stroke="#2f2c26" stroke-width="2.5" rx="12"/>
  <text x="300" y="380" text-anchor="middle" fill="#1d4e89" font-size="15" font-weight="700">sources/  (Layer 1)</text>
  <text x="300" y="402" text-anchor="middle" fill="#1d4e89" font-size="12">structured YAML from real code</text>
  <rect x="185" y="272" width="230" height="70" fill="#ffe1cc" stroke="#2f2c26" stroke-width="2.5" rx="12"/>
  <text x="300" y="300" text-anchor="middle" fill="#9a4a1e" font-size="15" font-weight="700">markdown/  (Layer 2)</text>
  <text x="300" y="322" text-anchor="middle" fill="#9a4a1e" font-size="12">the cross-linked bundle</text>
  <!-- candle -->
  <line x1="300" y1="272" x2="300" y2="242" stroke="#2f2c26" stroke-width="3" stroke-linecap="round"/>
  <path d="M 300 242 Q 293 229 300 218 Q 307 229 300 242" fill="#f0a500" stroke="#2f2c26" stroke-width="2"/>

  <!-- seed.yaml recipe card -->
  <g transform="rotate(-5 120 205)">
    <rect x="48" y="176" width="150" height="62" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2.5" rx="8"/>
    <text x="123" y="201" text-anchor="middle" fill="#6b5900" font-size="14" font-weight="700">seed.yaml</text>
    <text x="123" y="222" text-anchor="middle" fill="#8a6d00" font-size="11">the only file you edit</text>
  </g>
  <path d="M 150 242 Q 110 310 182 352" stroke="#e0533d" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/>
  <polygon points="190,357 174,355 182,343" fill="#e0533d"/>

  <!-- badges -->
  <g font-size="13" font-weight="700">
    <rect x="560" y="200" width="250" height="40" fill="#ddf2e2" stroke="#4aa06a" stroke-width="2" rx="20"/>
    <text x="685" y="225" text-anchor="middle" fill="#216b40">OKF v0.2 conformant bundle</text>
    <rect x="560" y="252" width="250" height="40" fill="#e9e1fb" stroke="#8a6fd0" stroke-width="2" rx="20"/>
    <text x="685" y="277" text-anchor="middle" fill="#53379e">MCP &#183; 9 unified tools</text>
    <rect x="560" y="304" width="250" height="40" fill="#d9e9fb" stroke="#5b8ec4" stroke-width="2" rx="20"/>
    <text x="685" y="329" text-anchor="middle" fill="#1d4e89">Hybrid RAG &#183; 1,291 chunks</text>
    <rect x="560" y="356" width="250" height="40" fill="#ffe1cc" stroke="#d98d5a" stroke-width="2" rx="20"/>
    <text x="685" y="381" text-anchor="middle" fill="#9a4a1e">45 services &#183; 830 APIs</text>
  </g>

  <!-- robot -->
  <g stroke="#2f2c26" stroke-width="2.5" fill="#ffffff">
    <rect x="640" y="430" width="56" height="44" rx="8"/>
    <circle cx="656" cy="450" r="5" fill="#2f2c26" stroke="none"/>
    <circle cx="680" cy="450" r="5" fill="#2f2c26" stroke="none"/>
    <line x1="668" y1="430" x2="668" y2="416"/>
    <circle cx="668" cy="412" r="4" fill="#f0a500"/>
  </g>
  <text x="720" y="448" fill="#8a8478" font-size="12" font-style="italic">&#8220;Finally! Docs I can read</text>
  <text x="720" y="464" fill="#8a8478" font-size="12" font-style="italic">without hallucinating.&#8221;</text>
  <text x="720" y="482" fill="#b0a890" font-size="11">&#8212; Botty, an AI agent</text>

  <text x="450" y="524" text-anchor="middle" fill="#8a8478" font-size="13">starring  Maya (the architect)  &#183;  Sam (day one)  &#183;  Botty (needs supervision)</text>
</svg>
