<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Avenir Next','Trebuchet MS',Verdana,sans-serif">
  <defs>
    <marker id="arr3l" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6b6455"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fbf7ec" rx="16"/>
  <text x="480" y="40" text-anchor="middle" fill="#2f2c26" font-size="24" font-weight="700">The three-layer cake &#8212; and who may touch what</text>
  <text x="480" y="63" text-anchor="middle" fill="#8a8478" font-size="13">one rule: edit seed.yaml &#183; everything else is derived</text>

  <!-- seed.yaml -->
  <g transform="rotate(-3 150 130)">
    <rect x="55" y="96" width="190" height="80" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2.5" rx="8"/>
    <text x="150" y="122" text-anchor="middle" fill="#6b5900" font-size="15" font-weight="700">seed.yaml</text>
    <text x="150" y="142" text-anchor="middle" fill="#8a6d00" font-size="11.5">declares ALL inputs</text>
    <text x="150" y="160" text-anchor="middle" fill="#8a6d00" font-size="11.5">edited by humans, via PR</text>
  </g>
  <text x="150" y="200" text-anchor="middle" fill="#216b40" font-size="12" font-weight="700">&#10003; YOU EDIT THIS</text>

  <!-- arrow seed -> ingest -->
  <line x1="248" y1="140" x2="322" y2="140" stroke="#6b6455" stroke-width="2.5" marker-end="url(#arr3l)"/>

  <!-- ingest workflows (LLM) -->
  <rect x="326" y="96" width="220" height="96" fill="#e9e1fb" stroke="#8a6fd0" stroke-width="2.5" rx="12"/>
  <text x="436" y="120" text-anchor="middle" fill="#53379e" font-size="14" font-weight="700">4 ingest workflows (LLM)</text>
  <text x="436" y="140" text-anchor="middle" fill="#53379e" font-size="11" font-family="'SF Mono',Menlo,monospace">/ingest-service  /ingest-wiki</text>
  <text x="436" y="156" text-anchor="middle" fill="#53379e" font-size="11" font-family="'SF Mono',Menlo,monospace">/ingest-bruno  /ingest-auxiliary</text>
  <text x="436" y="178" text-anchor="middle" fill="#8a6fd0" font-size="11">reads Java code, wiki, .bru files</text>
  <text x="436" y="212" text-anchor="middle" fill="#b03621" font-size="11.5" font-weight="700">the ONLY step that costs LLM $</text>

  <!-- arrow ingest -> sources -->
  <line x1="546" y1="144" x2="618" y2="144" stroke="#6b6455" stroke-width="2.5" marker-end="url(#arr3l)"/>

  <!-- Layer 1 sources -->
  <rect x="622" y="86" width="300" height="118" fill="#d9e9fb" stroke="#5b8ec4" stroke-width="2.5" rx="12"/>
  <text x="772" y="110" text-anchor="middle" fill="#1d4e89" font-size="15" font-weight="700">Layer 1 &#8212; sources/  (the truth)</text>
  <g fill="#1d4e89" font-size="11" font-family="'SF Mono',Menlo,monospace">
    <text x="640" y="132">services/&#60;name&#62;/catalog-info.yaml</text>
    <text x="640" y="148">api-contracts/  capability-flow/</text>
    <text x="640" y="164">adrs/  nfrs/  metadata/</text>
  </g>
  <text x="640" y="186" fill="#1d4e89" font-size="11">system of record &#183; 6 JSON schemas</text>
  <text x="772" y="222" text-anchor="middle" fill="#8a6d00" font-size="11.5" font-weight="700">edit only via re-running ingest</text>

  <!-- arrow sources down to generator -->
  <line x1="772" y1="230" x2="772" y2="282" stroke="#6b6455" stroke-width="2.5" marker-end="url(#arr3l)"/>

  <!-- generator -->
  <rect x="610" y="286" width="324" height="84" fill="#ffffff" stroke="#2f2c26" stroke-width="2.5" rx="12"/>
  <text x="772" y="312" text-anchor="middle" fill="#2f2c26" font-size="14" font-weight="700" font-family="'SF Mono',Menlo,monospace">kb generate</text>
  <text x="772" y="332" text-anchor="middle" fill="#8a8478" font-size="12">a gloriously BORING Python script &#8212; no LLM</text>
  <text x="772" y="352" text-anchor="middle" fill="#216b40" font-size="12" font-weight="700">same input &#8594; byte-identical output</text>

  <!-- arrow generator -> markdown -->
  <line x1="606" y1="328" x2="530" y2="328" stroke="#6b6455" stroke-width="2.5" marker-end="url(#arr3l)"/>

  <!-- Layer 2 markdown -->
  <rect x="210" y="270" width="316" height="122" fill="#ffe1cc" stroke="#d98d5a" stroke-width="2.5" rx="12"/>
  <text x="368" y="294" text-anchor="middle" fill="#9a4a1e" font-size="15" font-weight="700">Layer 2 &#8212; markdown/  (the cake)</text>
  <g fill="#9a4a1e" font-size="11" font-family="'SF Mono',Menlo,monospace">
    <text x="228" y="316">index.md  services/  api-catalog/</text>
    <text x="228" y="332">capability-flow/  adrs/  impact/</text>
    <text x="228" y="348">log.md  (chunks derived, not committed)</text>
  </g>
  <text x="368" y="372" text-anchor="middle" fill="#9a4a1e" font-size="11.5">cross-linked pages humans + robots read</text>
  <g transform="rotate(-4 368 412)">
    <rect x="290" y="398" width="156" height="30" fill="#ffe3de" stroke="#e0533d" stroke-width="2" rx="6"/>
    <text x="368" y="418" text-anchor="middle" fill="#b03621" font-size="12" font-weight="700">NEVER HAND-EDIT</text>
  </g>

  <!-- sync gate police -->
  <rect x="40" y="270" width="150" height="122" fill="#ddf2e2" stroke="#4aa06a" stroke-width="2.5" rx="12"/>
  <g stroke="#2f2c26" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="115" cy="308" r="16" fill="#ffffff"/>
    <path d="M 100 302 L 130 302 L 115 288 Z" fill="#2b7de0" stroke="#2f2c26" stroke-width="2"/>
    <circle cx="110" cy="310" r="2" fill="#2f2c26" stroke="none"/>
    <circle cx="120" cy="310" r="2" fill="#2f2c26" stroke="none"/>
  </g>
  <text x="115" y="346" text-anchor="middle" fill="#216b40" font-size="12" font-weight="700">the sync gate</text>
  <text x="115" y="363" text-anchor="middle" fill="#216b40" font-size="10.5">CI regenerates + diffs;</text>
  <text x="115" y="378" text-anchor="middle" fill="#216b40" font-size="10.5">any diff = build FAILS</text>
  <line x1="192" y1="330" x2="206" y2="330" stroke="#4aa06a" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- bottom summary strip -->
  <rect x="40" y="446" width="880" height="84" fill="#ffffff" stroke="#c9bfa4" stroke-width="2" rx="12"/>
  <g font-size="12.5" fill="#2f2c26">
    <text x="60" y="474" font-weight="700">Why boring wins:</text>
    <text x="60" y="496">&#8226; staleness is mechanically detectable (sync gate)   &#8226; CI runs at $0 LLM cost   &#8226; trust labels mean something</text>
    <text x="60" y="516" fill="#8a8478">Layer 1 is the truth &#183; Layer 2 is the view everyone reads &#183; the one rule keeps them from drifting apart</text>
  </g>
</svg>
