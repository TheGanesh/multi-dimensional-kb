<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Avenir Next','Trebuchet MS',Verdana,sans-serif">
  <rect width="960" height="560" fill="#fbf7ec" rx="16"/>
  <text x="480" y="40" text-anchor="middle" fill="#2f2c26" font-size="24" font-weight="700">The KB takes five exams &#8212; continuously, with numbers</text>
  <text x="480" y="63" text-anchor="middle" fill="#8a8478" font-size="13">&#8220;the demos went well&#8221; is not evidence &#8212; tripwires, not dashboards to admire</text>

  <!-- exam cards row 1 -->
  <g font-size="11.5">
    <rect x="40" y="88" width="284" height="130" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2.5" rx="12"/>
    <text x="182" y="112" text-anchor="middle" fill="#6b5900" font-size="14" font-weight="700">E1 &#8212; Ground truth</text>
    <text x="182" y="130" text-anchor="middle" fill="#8a6d00" font-style="italic">is the exam itself trustworthy?</text>
    <text x="56" y="152" fill="#6b5900">&#8226; LLM writes 5 Qs per chunk &#8212; URI = answer key</text>
    <text x="56" y="170" fill="#6b5900">&#8226; anti-leakage: paraphrase, don&#8217;t quote</text>
    <text x="56" y="188" fill="#6b5900">&#8226; versioned set + held-out test split</text>
    <text x="56" y="206" fill="#6b5900">&#8226; ~$1 for the whole 1,291-chunk corpus</text>

    <rect x="338" y="88" width="284" height="130" fill="#ddf2e2" stroke="#4aa06a" stroke-width="2.5" rx="12"/>
    <text x="480" y="112" text-anchor="middle" fill="#216b40" font-size="14" font-weight="700">E2 &#8212; Retrieval  (gates every PR)</text>
    <text x="480" y="130" text-anchor="middle" fill="#4aa06a" font-style="italic">does search find the right chunk?</text>
    <text x="354" y="152" fill="#216b40">&#8226; Recall@5 / Recall@10 / MRR &#8212; $0, no LLM</text>
    <text x="354" y="170" fill="#216b40">&#8226; page-level AND chunk-level hit rate</text>
    <text x="354" y="188" fill="#216b40">&#8226; boosts grid-searched, never assumed</text>
    <text x="354" y="206" fill="#216b40">&#8226; dense must win by &#916;R@5 &#8805; 0.03 to start</text>

    <rect x="636" y="88" width="284" height="130" fill="#e9e1fb" stroke="#8a6fd0" stroke-width="2.5" rx="12"/>
    <text x="778" y="112" text-anchor="middle" fill="#53379e" font-size="14" font-weight="700">E3 &#8212; Answer quality</text>
    <text x="778" y="130" text-anchor="middle" fill="#8a6fd0" font-style="italic">are the answers faithful?</text>
    <text x="652" y="152" fill="#53379e">&#8226; LLM judge: reasoning BEFORE verdict</text>
    <text x="652" y="170" fill="#53379e">&#8226; humans calibrate the judge (~50 verdicts)</text>
    <text x="652" y="188" fill="#53379e">&#8226; ~$0.25 per ~400 answers, per release</text>
    <text x="652" y="206" fill="#53379e">&#8226; story golden-dataset judge = downstream gate</text>
  </g>

  <!-- exam cards row 2 -->
  <g font-size="11.5">
    <rect x="190" y="238" width="284" height="130" fill="#d9e9fb" stroke="#5b8ec4" stroke-width="2.5" rx="12"/>
    <text x="332" y="262" text-anchor="middle" fill="#1d4e89" font-size="14" font-weight="700">E4 &#8212; Extraction fidelity</text>
    <text x="332" y="280" text-anchor="middle" fill="#5b8ec4" font-style="italic">does sources/ match the code?</text>
    <text x="206" y="302" fill="#1d4e89">&#8226; shrink the surface: parse OpenAPI, no LLM</text>
    <text x="206" y="320" fill="#1d4e89">&#8226; quarterly human spot-check: 5 services, 1 hr</text>
    <text x="206" y="338" fill="#1d4e89">&#8226; LLM-only facts stamped confidence: inferred</text>
    <text x="206" y="356" fill="#1d4e89">&#8226; automation waits for evidence it&#8217;s needed</text>

    <rect x="486" y="238" width="284" height="130" fill="#ffe1cc" stroke="#d98d5a" stroke-width="2.5" rx="12"/>
    <text x="628" y="262" text-anchor="middle" fill="#9a4a1e" font-size="14" font-weight="700">E5 &#8212; Trajectory</text>
    <text x="628" y="280" text-anchor="middle" fill="#d98d5a" font-style="italic">did Botty use the library well?</text>
    <text x="502" y="302" fill="#9a4a1e">&#8226; log every tool call now (nearly free)</text>
    <text x="502" y="320" fill="#9a4a1e">&#8226; judge later, when consumers go agentic</text>
    <text x="502" y="338" fill="#9a4a1e">&#8226; rubric: keywords sane, no duplicate calls,</text>
    <text x="502" y="356" fill="#9a4a1e">&#160;&#160;&#8804; 3 searches without clear reason</text>
  </g>

  <!-- perfect score warning -->
  <g transform="rotate(-2 130 320)">
    <rect x="40" y="252" width="130" height="110" fill="#ffe3de" stroke="#e0533d" stroke-width="2.5" rx="10"/>
    <text x="105" y="280" text-anchor="middle" fill="#b03621" font-size="26" font-weight="700">100%</text>
    <text x="105" y="302" text-anchor="middle" fill="#b03621" font-size="12" font-weight="700">= bad news</text>
    <text x="105" y="324" text-anchor="middle" fill="#b03621" font-size="10">a test that can&#8217;t fail</text>
    <text x="105" y="338" text-anchor="middle" fill="#b03621" font-size="10">can&#8217;t protect you</text>
    <text x="105" y="352" text-anchor="middle" fill="#b03621" font-size="10">(leakage suspected)</text>
  </g>

  <!-- circularity break -->
  <rect x="790" y="252" width="130" height="110" fill="#ffffff" stroke="#c9bfa4" stroke-width="2" rx="10"/>
  <text x="855" y="276" text-anchor="middle" fill="#2f2c26" font-size="11.5" font-weight="700">not circular:</text>
  <text x="855" y="296" text-anchor="middle" fill="#6b6455" font-size="10">answer key is ground</text>
  <text x="855" y="310" text-anchor="middle" fill="#6b6455" font-size="10">truth by construction;</text>
  <text x="855" y="324" text-anchor="middle" fill="#6b6455" font-size="10">E2 is pure arithmetic;</text>
  <text x="855" y="338" text-anchor="middle" fill="#6b6455" font-size="10">humans calibrate</text>
  <text x="855" y="352" text-anchor="middle" fill="#6b6455" font-size="10">the judge</text>

  <!-- telemetry strip -->
  <rect x="40" y="392" width="880" height="76" fill="#ffffff" stroke="#c9bfa4" stroke-width="2" rx="12"/>
  <text x="60" y="418" fill="#2f2c26" font-size="13" font-weight="700">Usage telemetry &#8212; JSONL first, zero standing infrastructure</text>
  <text x="60" y="440" fill="#6b6455" font-size="11.5" font-family="'SF Mono',Menlo,monospace">{"tool_name":"kb_smart_query","question":"&#8230;","top_uris":["kb://&#8230;"],"response_ms":41.2}</text>
  <text x="60" y="460" fill="#6b6455" font-size="12">weekly kb usage-report: queries/tool &#183; p95 latency &#183; zero-result queries (= the ingest backlog) &#183; never-retrieved pages &#183; SLOs</text>

  <!-- footer -->
  <rect x="40" y="482" width="880" height="48" fill="#f4eeda" stroke="#c9bfa4" stroke-width="1.5" rx="10"/>
  <text x="480" y="502" text-anchor="middle" fill="#6b6455" font-size="12.5">what gates what: E2 gates every PR &#183; E3 + E4 gate releases &#183; Postgres + Grafana graduate only when real traffic (online judge) arrives</text>
  <text x="480" y="521" text-anchor="middle" fill="#6b6455" font-size="12">the expensive part was never compute &#8212; it was deciding to measure at all</text>
</svg>
