<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Avenir Next','Trebuchet MS',Verdana,sans-serif">
  <rect width="960" height="540" fill="#fbf7ec" rx="16"/>
  <text x="480" y="42" text-anchor="middle" fill="#2f2c26" font-size="24" font-weight="700">Knowledge rot: five sources, zero trust</text>
  <text x="480" y="66" text-anchor="middle" fill="#8a8478" font-size="13">the docs exist &#8212; their relationship with reality decays silently, and no alarm goes off</text>

  <!-- Sam in the middle -->
  <g stroke="#2f2c26" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="480" cy="240" r="26" fill="#ffffff"/>
    <circle cx="471" cy="235" r="3" fill="#2f2c26" stroke="none"/>
    <circle cx="489" cy="235" r="3" fill="#2f2c26" stroke="none"/>
    <path d="M 470 252 Q 480 246 490 252"/>
    <line x1="480" y1="266" x2="480" y2="330"/>
    <line x1="480" y1="285" x2="450" y2="308"/>
    <line x1="480" y1="285" x2="510" y2="308"/>
    <line x1="480" y1="330" x2="460" y2="372"/>
    <line x1="480" y1="330" x2="500" y2="372"/>
  </g>
  <text x="480" y="398" text-anchor="middle" fill="#2f2c26" font-size="13" font-weight="700">Sam, day one</text>
  <text x="480" y="416" text-anchor="middle" fill="#8a8478" font-size="12">&#8220;where do I find what shoppingcartms does?&#8221;</text>

  <!-- five sticky notes around Sam -->
  <g transform="rotate(-4 165 150)">
    <rect x="70" y="110" width="190" height="76" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2" rx="6"/>
    <text x="165" y="138" text-anchor="middle" fill="#6b5900" font-size="13" font-weight="700">Confluence page</text>
    <text x="165" y="158" text-anchor="middle" fill="#8a6d00" font-size="12">&#8220;from 2023&#8230; ish&#8221;</text>
    <text x="165" y="176" text-anchor="middle" fill="#b03621" font-size="11">last verified: never</text>
  </g>
  <g transform="rotate(3 795 150)">
    <rect x="700" y="110" width="190" height="76" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2" rx="6"/>
    <text x="795" y="138" text-anchor="middle" fill="#6b5900" font-size="13" font-weight="700">&#8220;Read the code&#8221;</text>
    <text x="795" y="158" text-anchor="middle" fill="#8a6d00" font-size="12">all 45 repos of it</text>
    <text x="795" y="176" text-anchor="middle" fill="#b03621" font-size="11">time budget: weeks</text>
  </g>
  <g transform="rotate(-3 165 330)">
    <rect x="70" y="292" width="190" height="76" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2" rx="6"/>
    <text x="165" y="320" text-anchor="middle" fill="#6b5900" font-size="13" font-weight="700">&#8220;Ask Priya&#8221;</text>
    <text x="165" y="340" text-anchor="middle" fill="#8a6d00" font-size="12">Priya left in March</text>
    <text x="165" y="358" text-anchor="middle" fill="#b03621" font-size="11">knowledge: departed</text>
  </g>
  <g transform="rotate(4 795 330)">
    <rect x="700" y="292" width="190" height="76" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2" rx="6"/>
    <text x="795" y="320" text-anchor="middle" fill="#6b5900" font-size="13" font-weight="700">Bruno collection</text>
    <text x="795" y="340" text-anchor="middle" fill="#8a6d00" font-size="12">&#8220;somewhere&#8221;</text>
    <text x="795" y="358" text-anchor="middle" fill="#b03621" font-size="11">location: unknown</text>
  </g>
  <g transform="rotate(-2 480 128)">
    <rect x="385" y="96" width="190" height="66" fill="#fff3b8" stroke="#d8bc4a" stroke-width="2" rx="6"/>
    <text x="480" y="122" text-anchor="middle" fill="#6b5900" font-size="13" font-weight="700">The wiki says port 8081</text>
    <text x="480" y="144" text-anchor="middle" fill="#b03621" font-size="12">it&#8217;s actually 8443 now</text>
  </g>

  <!-- dashed lines from notes to Sam -->
  <g stroke="#c9bfa4" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <line x1="262" y1="160" x2="440" y2="222"/>
    <line x1="698" y1="160" x2="520" y2="222"/>
    <line x1="262" y1="322" x2="442" y2="290"/>
    <line x1="698" y1="322" x2="518" y2="290"/>
    <line x1="480" y1="164" x2="480" y2="206"/>
  </g>

  <!-- the amplifier: Botty -->
  <rect x="292" y="442" width="580" height="74" fill="#ffe3de" stroke="#e0533d" stroke-width="2.5" rx="12"/>
  <g stroke="#2f2c26" stroke-width="2.5" fill="#ffffff">
    <rect x="312" y="456" width="46" height="38" rx="7"/>
    <circle cx="326" cy="473" r="4" fill="#2f2c26" stroke="none"/>
    <circle cx="345" cy="473" r="4" fill="#2f2c26" stroke="none"/>
  </g>
  <text x="376" y="470" fill="#b03621" font-size="14" font-weight="700">Botty reads the same rot &#8212; at machine speed, with total confidence.</text>
  <text x="376" y="494" fill="#b03621" font-size="13" font-family="'SF Mono',Menlo,Consolas,monospace">invented: getCartDiscountsV2()  &#8592; does not exist. never has.</text>

  <!-- left note -->
  <rect x="70" y="452" width="190" height="56" fill="#ffffff" stroke="#c9bfa4" stroke-width="2" rx="10"/>
  <text x="165" y="475" text-anchor="middle" fill="#2f2c26" font-size="12" font-weight="700">humans cross-check.</text>
  <text x="165" y="494" text-anchor="middle" fill="#8a8478" font-size="12">LLMs amplify. by default.</text>
</svg>
